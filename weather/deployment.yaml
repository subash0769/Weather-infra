apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather
  namespace: weather
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather
  template:
    metadata:
      labels:
        app: weather
    spec:
      containers:
      - name: weather
        image: subash0769/weather-app:e50d2f7
        resources:
          requests:
            memory: "128Mi" 
            cpu: "500m" 
          limits:
            memory: "256Mi"
            cpu: "700m"
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3