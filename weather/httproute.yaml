apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weather-app
  namespace: weather
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - weather.local          
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: weather-service
          port: 8000